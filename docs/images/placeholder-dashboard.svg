<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sidebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252540;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6521c8;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#a67de5;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)" rx="8"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="80" height="480" fill="url(#sidebar)" rx="8"/>
  <rect x="20" y="20" width="40" height="40" rx="8" fill="#a67de5" opacity="0.6"/>
  <rect x="20" y="80" width="40" height="8" rx="4" fill="#666" opacity="0.4"/>
  <rect x="20" y="100" width="40" height="8" rx="4" fill="#666" opacity="0.4"/>
  <rect x="20" y="120" width="40" height="8" rx="4" fill="#666" opacity="0.4"/>
  
  <!-- Top bar -->
  <rect x="100" y="20" width="280" height="32" rx="16" fill="#2d2d44" opacity="0.5"/>
  <circle cx="130" cy="36" r="8" fill="#a67de5" opacity="0.5"/>
  <rect x="150" y="32" width="120" height="8" rx="4" fill="#666" opacity="0.4"/>
  
  <!-- Chart area -->
  <rect x="100" y="70" width="300" height="180" rx="12" fill="#1e1e36" opacity="0.5"/>
  <!-- Grid lines -->
  <line x1="130" y1="100" x2="380" y2="100" stroke="#333" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="140" x2="380" y2="140" stroke="#333" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="180" x2="380" y2="180" stroke="#333" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="220" x2="380" y2="220" stroke="#333" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="250" x2="380" y2="250" stroke="#333" stroke-width="1" opacity="0.3"/>
  <!-- Bars -->
  <rect x="145" y="200" width="28" height="50" rx="4" fill="url(#chart)"/>
  <rect x="190" y="160" width="28" height="90" rx="4" fill="url(#chart)"/>
  <rect x="235" y="130" width="28" height="120" rx="4" fill="url(#chart)"/>
  <rect x="280" y="150" width="28" height="100" rx="4" fill="url(#chart)"/>
  <rect x="325" y="110" width="28" height="140" rx="4" fill="url(#chart)"/>
  <rect x="370" y="140" width="28" height="110" rx="4" fill="url(#chart)"/>
  
  <!-- Stats cards -->
  <rect x="430" y="70" width="170" height="85" rx="12" fill="#1e1e36" opacity="0.5"/>
  <rect x="445" y="85" width="40" height="40" rx="8" fill="#6521c8" opacity="0.4"/>
  <rect x="495" y="88" width="85" height="8" rx="4" fill="#666" opacity="0.4"/>
  <rect x="445" y="110" width="60" height="12" rx="6" fill="#a67de5" opacity="0.3"/>
  
  <rect x="430" y="170" width="170" height="85" rx="12" fill="#1e1e36" opacity="0.5"/>
  <rect x="445" y="185" width="40" height="40" rx="8" fill="#a67de5" opacity="0.4"/>
  <rect x="495" y="188" width="85" height="8" rx="4" fill="#666" opacity="0.4"/>
  <rect x="445" y="210" width="60" height="12" rx="6" fill="#a67de5" opacity="0.3"/>
  
  <!-- Session list -->
  <rect x="100" y="270" width="500" height="190" rx="12" fill="#1e1e36" opacity="0.5"/>
  <!-- Session items -->
  <rect x="120" y="290" width="360" height="40" rx="8" fill="#2d2d44" opacity="0.4"/>
  <circle cx="140" cy="310" r="12" fill="#a67de5" opacity="0.4"/>
  <rect x="165" y="304" width="120" height="12" rx="6" fill="#666" opacity="0.3"/>
  <rect x="460" y="304" width="50" height="12" rx="6" fill="#6521c8" opacity="0.3"/>
  
  <rect x="120" y="340" width="360" height="40" rx="8" fill="#2d2d44" opacity="0.4"/>
  <circle cx="140" cy="360" r="12" fill="#a67de5" opacity="0.4"/>
  <rect x="165" y="354" width="140" height="12" rx="6" fill="#666" opacity="0.3"/>
  <rect x="460" y="354" width="50" height="12" rx="6" fill="#6521c8" opacity="0.3"/>
  
  <rect x="120" y="390" width="360" height="40" rx="8" fill="#2d2d44" opacity="0.4"/>
  <circle cx="140" cy="410" r="12" fill="#a67de5" opacity="0.4"/>
  <rect x="165" y="404" width="100" height="12" rx="6" fill="#666" opacity="0.3"/>
  <rect x="460" y="404" width="50" height="12" rx="6" fill="#6521c8" opacity="0.3"/>
  
  <!-- Placeholder text -->
  <text x="400" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#a67de5" opacity="0.3" font-weight="600">Dashboard Screenshot Placeholder</text>
</svg>
